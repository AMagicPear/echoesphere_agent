[project]
name = "echoesphere-agent"
version = "0.1.0"
description = "EchoSphere Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.11.4",
    "langchain>=1.2.14",
    "pillow>=12.1.1",
    "python-dotenv>=1.2.2",
    "smolagents[litellm,telemetry]>=1.24.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["jupyter-client>=8.8.0"]
